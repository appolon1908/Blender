name: Import official Blender source

on:
  push:
    branches:
      - bootstrap/upstream-import-20261002
    paths:
      - .github/workflows/import-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import official upstream source snapshot
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/blender/blender.git
          UPSTREAM_BRANCH: main
          IMPORT_BRANCH: import/upstream-source-20261002
          PRODUCT_NAME: Blender
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/$IMPORT_BRANCH" >/dev/null 2>&1; then
            echo "Import branch already exists; leaving it unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp="$(mktemp -d)"
          git clone --depth 1 --single-branch --branch "$UPSTREAM_BRANCH" "$UPSTREAM_URL" "$tmp/upstream"
          upstream_sha="$(git -C "$tmp/upstream" rev-parse HEAD)"

          git checkout -b "$IMPORT_BRANCH"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' "$tmp/upstream"/ ./

          if [ -d .github/workflows ]; then
            mv .github/workflows .github-workflows-disabled
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          signature = b"version https://git-lfs.github.com/spec/v1\n"
          entries = []
          total = 0

          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if not data.startswith(signature):
                  continue

              text = data.decode("utf-8", errors="replace")
              oid = re.search(r"^oid sha256:([0-9a-f]{64})$", text, re.M)
              size = re.search(r"^size ([0-9]+)$", text, re.M)
              oid_value = oid.group(1) if oid else "unknown"
              size_value = int(size.group(1)) if size else 0
              entries.append((path.as_posix(), oid_value, size_value))
              total += size_value
              path.unlink()

          entries.sort()
          with open("UPSTREAM_LFS_POINTERS.txt", "w", encoding="utf-8") as f:
              f.write("# Blender upstream Git LFS object manifest\n")
              f.write("# Binary LFS payloads are intentionally not mirrored into this repository.\n")
              f.write(f"# Objects: {len(entries)}\n")
              f.write(f"# Declared bytes: {total}\n")
              f.write("# path\tsha256\tsize_bytes\n")
              for path, oid, size in entries:
                  f.write(f"{path}\t{oid}\t{size}\n")

          print(f"Removed {len(entries)} Git LFS pointer files representing {total} bytes of external binary assets")
          PY

          cat > UPSTREAM_SOURCE.md <<EOF
          # Upstream source import

          Product: $PRODUCT_NAME

          Official upstream: $UPSTREAM_URL

          Upstream branch: $UPSTREAM_BRANCH

          Upstream commit: $upstream_sha

          Import date: 2026-10-02

          This repository contains the official Blender source-code snapshot from the
          upstream branch above. Git LFS-managed binary assets are intentionally not
          duplicated into this repository; their original paths, SHA-256 object IDs,
          and declared sizes are recorded in `UPSTREAM_LFS_POINTERS.txt`.

          Upstream GitHub Actions workflows are preserved under
          `.github-workflows-disabled/` so importing the source cannot automatically
          execute third-party CI in this repository.
          EOF

          large_files="$(find . -type f -not -path './.git/*' -size +95M -print || true)"
          if [ -n "$large_files" ]; then
            echo "::error::Import stopped because regular Git files larger than 95 MiB were found:"
            echo "$large_files"
            exit 1
          fi

          git add -A
          git commit -m "vendor: import official Blender source at $upstream_sha"
          git push --no-verify origin "HEAD:refs/heads/$IMPORT_BRANCH"
