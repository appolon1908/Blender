name: Import official Blender source

on:
  push:
    branches:
      - bootstrap/upstream-import-20261002
    paths:
      - .github/workflows/import-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import official upstream snapshot
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/blender/blender.git
          UPSTREAM_BRANCH: main
          IMPORT_BRANCH: import/upstream-source-20261002
          PRODUCT_NAME: Blender
          GIT_LFS_SKIP_SMUDGE: "1"
          GIT_LFS_SKIP_PUSH: "1"
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/$IMPORT_BRANCH" >/dev/null 2>&1; then
            echo "Import branch already exists; leaving it unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp="$(mktemp -d)"
          git clone --depth 1 --single-branch --branch "$UPSTREAM_BRANCH" "$UPSTREAM_URL" "$tmp/upstream"
          upstream_sha="$(git -C "$tmp/upstream" rev-parse HEAD)"

          git checkout -b "$IMPORT_BRANCH"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' "$tmp/upstream"/ ./

          if [ -d .github/workflows ]; then
            mv .github/workflows .github-workflows-disabled
          fi

          large_files="$(find . -type f -not -path './.git/*' -size +95M -print || true)"
          if [ -n "$large_files" ]; then
            echo "::error::Import stopped because files larger than 95 MiB were found:"
            echo "$large_files"
            exit 1
          fi

          cat > UPSTREAM_SOURCE.md <<EOF
          # Upstream source import

          Product: $PRODUCT_NAME

          Official upstream: $UPSTREAM_URL

          Upstream branch: $UPSTREAM_BRANCH

          Upstream commit: $upstream_sha

          Import date: 2026-10-02

          This repository contains the Blender source snapshot from the official upstream project.
          Git LFS pointer files from upstream are preserved as pointers; external upstream LFS
          binary objects are not re-uploaded into this repository. Upstream GitHub Actions
          workflows are preserved under `.github-workflows-disabled/` so importing source
          cannot automatically execute third-party CI here.
          EOF

          git add -A
          git commit -m "vendor: import official Blender source at $upstream_sha"

          # Blender tracks many binary formats with Git LFS. The source snapshot only
          # needs the pointer files, so bypass the LFS pre-push hook that stalled the
          # first attempt trying to upload upstream binary objects.
          git push --no-verify origin "HEAD:refs/heads/$IMPORT_BRANCH"
