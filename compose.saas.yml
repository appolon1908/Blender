services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.saas
    restart: unless-stopped
    ports:
      - "127.0.0.1:18121:8080"
    environment:
      CODESTRA_AUTH_MODE: required
      CODESTRA_API_KEY: ${CODESTRA_API_KEY:?set CODESTRA_API_KEY}
      CODESTRA_EXECUTION_ENABLED: "false"
    volumes:
      - blender_saas_data:/data
volumes:
  blender_saas_data:
